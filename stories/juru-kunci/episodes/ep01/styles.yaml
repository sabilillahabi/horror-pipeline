# Per-beat delivery directions for Gemini TTS (appended to the speaker's default style).
# Default for every speaker: story style + "Tempo sedang, mengalir, tidak diseret." (story.yaml gemini_pace).
# Rule (since 23 Nov 2026): at most 3 slow/dramatic lines per part (words like "pelan", "lambat",
# "jeda panjang", "berhenti sejenak"); everything else keeps the flowing default tempo.
# Beats not listed here use the speaker's default style only — consecutive beats of the same speaker with
# the same style are sent to Gemini as ONE request (fewer requests).
#
# ep01 note: clips were recorded with the old styles and re-paced with `repace` (tts.locked in script.yaml);
# this file is the reference for any re-recording.

# --- Part 1: Gerbang (slow lines: b004, b008, b018d)
