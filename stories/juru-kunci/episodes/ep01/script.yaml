        characters_in_scene: []

      - id: b067
        speaker: narrator
        text: "Kakiku bergerak sendiri. Aku tahu itu bodoh. Tapi aku menggenggam kunci kuningan itu, lalu berjalan ke arah tujuh beringin."
        scene: "Walking down a dark village road at night with a flashlight in one hand and the brass key in the other, banyan trees looming ahead"
        characters_in_scene: [{name: bayu, position: center}]

      - id: b067a
        speaker: narrator
        text: "Semakin dekat ke makam, udara semakin dingin. Bau kemenyan yang tadinya tipis sekarang menyengat. Dan di bawah sinar senter, aku melihat sesuatu di jalan tanah."
        scene: "Flashlight beam on a dirt path at night revealing a small fresh offering of flowers, a burning incense stick and an egg on a banana leaf, banyan roots in the background"
        characters_in_scene: []

      - id: b067b
        speaker: narrator
        text: "Sesaji. Masih baru. Dupanya bahkan masih menyala. Padahal di desa ini, katanya, cuma juru kunci yang boleh ke makam malam-malam."
