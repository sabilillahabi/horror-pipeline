        characters_in_scene: []

      - id: b063
        speaker: narrator
        text: "Malam itu malam Jumat Kliwon. Aturan pertama. Jangan tidur sebelum ayam berkokok."
        reuse: b062
        crop: detail

      - id: b064
        speaker: narrator
        text: "Jadi aku duduk di teras dengan kopi hitam dan senter. Menunggu."
