        text: "Dia menoleh. Tersenyum. Lalu menghilang, seperti asap yang ditiup angin."
        scene: "Empty stone steps of the graveyard gate at night, a thin wisp of mist dissolving where someone was sitting"
        characters_in_scene: []

      - id: b070
