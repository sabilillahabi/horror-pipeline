        characters_in_scene: [{name: bayu, position: center}]

      - id: b065
        speaker: narrator
        text: "Jam sebelas. Jam dua belas. Desa sunyi total."
        reuse: b029
        crop: detail

      - id: b066
        speaker: narrator
        text: "Lalu dari arah makam, terdengar suara kentongan. Pelan. Tiga kali. Berhenti. Lalu tiga kali lagi."
