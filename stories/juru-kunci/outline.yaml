# - Nomor episode mulai lagi dari 1 di setiap jilid; jilid 2 = folder cerita baru stories/juru-kunci-jilid2/.
# - Posisi dalam jilid TIDAK pernah ditampilkan ke penonton (tidak ada "x/6", "Jilid 1"); hanya "Eps N" dan "Part N/M".
# - Jilid 1 dipadatkan jadi 6 episode (keputusan Bil, 28 Nov 2026): ep01-03 tetap, ep04-06 menggabungkan rencana lama ep04-09.
# - Aturan lengkap: references/10-story-length.md
title: "Juru Kunci"
slug: juru-kunci
jilid: 1
arcs:
  1: "Bayu pulang, menjadi juru kunci, belajar aturan kunci"
  2: "Masa lalu Sumirah terungkap, dan warga ternyata tahu semuanya (ep04-05)"
  3: "Konfrontasi dengan Sang Penunggu dan ending (ep06)"
style:
  narration: "Narator 'aku' memakai gaya santai seperti ep01 ('nggak', bukan 'tidak'); dialog warga/Mbah Karto boleh lebih Jawa. ep02 sengaja dibiarkan 'tidak' karena klip TTS dipakai ulang; mulai ep03 kembali ke gaya ep01."
continuity:
  - "Sudah tayang: tembang Sekar (ep01, ep02), kentongan tiga kali (ep01, ep02), sesaji baru di makam malam pertama (ep01), Pak Darno warga yang biasanya banyak bicara (ep02), peta tujuh beringin di balik halaman tersembunyi (ep02)"
  - "Belum boleh: Sumirah bicara langsung (akhir ep05/ep06), wujud Sang Penunggu (ep06), aturan keempat (ep06), Sumirah pergi (ep06)"
episodes:
  # ---------------------------------------------------------------- ARC 1
  - number: 1
    jilid: 1
    arc: 1
    working_title: "Pulang"
    status: done
    parts: ["Gerbang", "Juru Kunci", "Tiga Aturan", "Tusuk Konde"]
    key_events:
      - "Bayu pulang ke desa setelah kakeknya ditemukan bersujud di gerbang makam, menggenggam sesuatu yang dirahasiakan warga"
      - "Pemakaman: warga datang semua, tak ada yang menangis; semua menyapa Bayu 'Mas Juru Kunci'"
      - "Mbah Karto menyerahkan kunci kuningan dan tiga aturan juru kunci (salah satunya: jangan menyebut nama Sang Penunggu)"
      - "Bayu menemukan buku tulis kakek dengan halaman sobek rapi, lalu berjaga di gerbang dan melihat perempuan berkebaya hijau"
    cliffhanger: "Sekar menyerahkan tusuk konde perak titipan perempuan berkebaya hijau; sanggul perempuan itu ternyata kehilangan tusuk kondenya"
    characters: [narrator, bayu, sekar, mbah_karto, warga, sumirah]
  - number: 2
