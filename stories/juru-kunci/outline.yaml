    reveal: "Warga tahu semuanya sejak awal dan memilih Bayu sebagai juru kunci supaya Sekar bisa dijadikan tumbal"
    characters: [narrator, bayu, sekar, mbah_karto, warga, lurah, sumirah]
  # ---------------------------------------------------------------- ARC 3
  - number: 6
    jilid: 1
