      - "Kakek Bayu menjadi juru kunci untuk menebus dosa itu; Bayu hampir menyebut nama Sang Penunggu karena marah, lalu dihentikan"
      - "Warga mengepung rumah kakek karena menginginkan Sekar sebagai pengganti; Bayu dan Sekar kabur lewat jalan belakang dibantu Mbah Karto"
