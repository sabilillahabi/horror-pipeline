      - "Bayu menyebut nama itu dan mengikat Sang Penunggu dengan kunci kuningan; Sumirah akhirnya pergi dari undakan gerbang, tusuk konde kembali ke sanggulnya"
      - "Warga menghadapi akibat perbuatan mereka, Mbah Karto menyerahkan diri; Bayu memutuskan tetap menjadi juru kunci, Sekar selamat"
    cliffhanger: "Fajar tiba, desa tenang, tapi gembok baru di gerbang sudah terbuka"
    reveal: "Semua benang jilid 1 tertutup: Sumirah bebas, warga terbongkar, Sekar selamat, penunggu terikat"
    hook_jilid_2: "Di buku kakek ada nama juru kunci pertama, dan namanya bukan orang desa Wringinpitu"
