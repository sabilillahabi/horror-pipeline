      - "Pak Lurah mengaku: setiap juru kunci 'dibayar' warga lewat hadiah supaya penunggu tidak mengambil orang desa; halaman-halaman sobek lainnya ternyata diambil warga (kakek hanya menyembunyikan satu halaman di balik foto)"
    cliffhanger: "Warga mengundang Bayu ke selamatan besar; di undangan tertulis nama Sekar sebagai tamu kehormatan"
    characters: [narrator, bayu, sekar, mbah_karto, warga, lurah, sumirah]
  - number: 5
