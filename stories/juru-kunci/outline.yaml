      - "Bayu menemukan halaman hilang di balik foto keluarga: kembalikan tusuk konde di bawah beringin ketujuh sebelum ayam berkokok"
      - "Warga tak berani menatap Bayu; Sekar berdiri di jendela menatap tujuh beringin"
    cliffhanger: "Pintu kamar Sekar terbuka sendiri tengah malam, dan Sekar berbicara dengan kata-kata yang bukan miliknya"
    characters: [narrator, bayu, sekar, mbah_karto, warga, sumirah]
  - number: 3
    jilid: 1
